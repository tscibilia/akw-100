name: Bug report
description: Report a reproducible problem
title: "[bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Skill release version
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness type and version
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Remove client names, project addresses, credentials, and confidential content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?