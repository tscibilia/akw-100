name: Feature request
description: Suggest an improvement
title: "[feature] "
labels: [enhancement]
body:
  - type: input
    id: version
    attributes:
      label: Release version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Do not include confidential client or project information.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior