# Project scope only. The host guard in ~/.omp/agent/config.yml, the host
# RULES.md, and the secret-guard hook stay in force. Evals are not prompted.
tools:
  approval:
    web_search: allow
bash:
  # Ordered, first match wins; project rules are evaluated before host rules.
  patterns:
    - match: "git push --force* main*"
      approval: deny
    - match: "git push -f* main*"
      approval: deny
    - match: "git push* main* --force*"
      approval: deny
    - match: "git push* +main*"
      approval: deny
    - match: "git push --force-with-lease*"
      approval: allow
    - match: "git push --force*"
      approval: allow
    - match: "git push -f*"
      approval: allow
    - match: "git add*"
      approval: allow
    - match: "git commit*"
      approval: allow
    - match: "git push*"
      approval: allow
    - match: "git switch -c*"
      approval: allow
    - match: "git checkout -b*"
      approval: allow
    - match: "gh pr create*"
      approval: allow
    - match: "mise *"
      approval: allow
    - match: "just *"
      approval: allow
